<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="720" viewBox="0 0 1360 720">
<style>
  text { font-family: Inter, Segoe UI, Arial, sans-serif; fill:#0f172a; }
  .title { font-size:48px; font-weight:820; }
  .subtitle { font-size:22px; fill:#52637a; }
  .metric { font-size:58px; font-weight:820; }
  .label { font-size:20px; font-weight:740; }
  .muted { font-size:18px; fill:#64748b; }
  .cardTitle { font-size:20px; font-weight:760; }
</style>
<defs>
  <linearGradient id="verifyBg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#ffffff"/>
    <stop offset="1" stop-color="#f8fafc"/>
  </linearGradient>
  <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
</defs>
<rect x="1" y="1" width="1358" height="718" rx="24" fill="url(#verifyBg)" stroke="#e2e8f0"/>
<text x="54" y="72" class="title">Verification surface</text>
<text x="54" y="112" class="subtitle">Makefile-exposed checks grouped by what they stress, from leaf RTL to full-SoC programs.</text>

<g filter="url(#softShadow)">
  <rect x="54" y="156" width="604" height="498" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="370" cy="414" r="132" fill="none" stroke="#e2e8f0" stroke-width="34"/>
  <circle cx="370" cy="414" r="132" fill="none" stroke="#0f766e" stroke-width="34" stroke-linecap="round" stroke-dasharray="202.35 829.38" stroke-dashoffset="-0.00" transform="rotate(-90 370 414)"/><circle cx="370" cy="414" r="132" fill="none" stroke="#2563eb" stroke-width="34" stroke-linecap="round" stroke-dasharray="202.35 829.38" stroke-dashoffset="-207.35" transform="rotate(-90 370 414)"/><circle cx="370" cy="414" r="132" fill="none" stroke="#7c3aed" stroke-width="34" stroke-linecap="round" stroke-dasharray="228.26 829.38" stroke-dashoffset="-414.69" transform="rotate(-90 370 414)"/><circle cx="370" cy="414" r="132" fill="none" stroke="#d97706" stroke-width="34" stroke-linecap="round" stroke-dasharray="98.67 829.38" stroke-dashoffset="-647.95" transform="rotate(-90 370 414)"/><circle cx="370" cy="414" r="132" fill="none" stroke="#0891b2" stroke-width="34" stroke-linecap="round" stroke-dasharray="46.84 829.38" stroke-dashoffset="-751.63" transform="rotate(-90 370 414)"/><circle cx="370" cy="414" r="132" fill="none" stroke="#475569" stroke-width="34" stroke-linecap="round" stroke-dasharray="20.92 829.38" stroke-dashoffset="-803.46" transform="rotate(-90 370 414)"/>
  <text x="370" y="398" text-anchor="middle" class="metric">32</text>
  <text x="370" y="430" text-anchor="middle" class="label">documented</text>
  <text x="370" y="456" text-anchor="middle" class="label">targets</text>
  <text x="88" y="606" class="muted">Representative target groups. `make help` remains the authoritative command index.</text>
</g>

<g filter="url(#softShadow)">
  <g><rect x="712" y="210" width="320" height="92" rx="16" fill="#fff" stroke="#e2e8f0"/><circle cx="746" cy="256" r="12" fill="#0f766e"/><text x="774" y="250" class="cardTitle">Leaf units</text><text x="774" y="278" class="muted">8 make targets</text></g><g><rect x="1084" y="210" width="320" height="92" rx="16" fill="#fff" stroke="#e2e8f0"/><circle cx="1118" cy="256" r="12" fill="#2563eb"/><text x="1146" y="250" class="cardTitle">Pipeline regs/control</text><text x="1146" y="278" class="muted">8 make targets</text></g><g><rect x="712" y="342" width="320" height="92" rx="16" fill="#fff" stroke="#e2e8f0"/><circle cx="746" cy="388" r="12" fill="#7c3aed"/><text x="774" y="382" class="cardTitle">ISA integration</text><text x="774" y="410" class="muted">9 make targets</text></g><g><rect x="1084" y="342" width="320" height="92" rx="16" fill="#fff" stroke="#e2e8f0"/><circle cx="1118" cy="388" r="12" fill="#d97706"/><text x="1146" y="382" class="cardTitle">Memory/cache</text><text x="1146" y="410" class="muted">4 make targets</text></g><g><rect x="712" y="474" width="320" height="92" rx="16" fill="#fff" stroke="#e2e8f0"/><circle cx="746" cy="520" r="12" fill="#0891b2"/><text x="774" y="514" class="cardTitle">SoC software</text><text x="774" y="542" class="muted">2 make targets</text></g><g><rect x="1084" y="474" width="320" height="92" rx="16" fill="#fff" stroke="#e2e8f0"/><circle cx="1118" cy="520" r="12" fill="#475569"/><text x="1146" y="514" class="cardTitle">Formal target</text><text x="1146" y="542" class="muted">1 make target</text></g>
</g>

<g>
  <rect x="712" y="606" width="692" height="48" rx="12" fill="#f1f5f9"/>
  <text x="740" y="637" class="label">Full-SoC software targets require built IMEM images from `make sw-all`.</text>
</g>
</svg>
