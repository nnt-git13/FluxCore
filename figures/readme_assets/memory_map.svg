      <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6"/></marker>
      <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C5CE6"/></marker>
      <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A8A94"/></marker>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0B1620" flood-opacity="0.10"/></filter>
    </defs><text x="80" y="78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700" fill="#0B1620" text-anchor="start" letter-spacing="0" opacity="1">Harvard BRAM memory model</text><text x="80" y="118" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#5D6A73" text-anchor="start" letter-spacing="0" opacity="1">IMEM and DMEM are separate physical memories, so both address spaces begin at zero.</text><line x1="80" y1="145" x2="1520" y2="145" stroke="#D7E1E7" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="105" y="215" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0F766E" text-anchor="start" letter-spacing="0" opacity="1">IMEM</text><text x="105" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5D6A73" text-anchor="start" letter-spacing="0" opacity="1">16 KiB · 4096 words</text><rect x="360" y="195" width="1120" height="90" rx="22" fill="#F4F8FA" stroke="#0F766E" stroke-width="3" opacity="1"/><rect x="360" y="195" width="1120" height="90" rx="22" fill="#DDF6F1" stroke="none" stroke-width="1" opacity="1"/><text x="385" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1620" text-anchor="start" letter-spacing="0" opacity="1">0x0000_0000</text><text x="1455" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1620" text-anchor="end" letter-spacing="0" opacity="1">0x0000_3FFF</text><text x="920" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#0F766E" text-anchor="middle" letter-spacing="0" opacity="1">program image loaded with $readmemh</text><text x="105" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#3B82F6" text-anchor="start" letter-spacing="0" opacity="1">DMEM</text><text x="105" y="395" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5D6A73" text-anchor="start" letter-spacing="0" opacity="1">8 KiB · 2048 words</text><rect x="360" y="340" width="1120" height="120" rx="22" fill="#F4F8FA" stroke="#3B82F6" stroke-width="3" opacity="1"/><rect x="360" y="340" width="980" height="120" rx="22" fill="#EAF2FF" stroke="none" stroke-width="1" opacity="1"/><rect x="1340" y="340" width="140" height="120" rx="18" fill="#F2EAFE" stroke="none" stroke-width="1" opacity="1"/><text x="385" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1620" text-anchor="start" letter-spacing="0" opacity="1">0x0000_0000</text><text x="865" y="390" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#3B82F6" text-anchor="middle" letter-spacing="0" opacity="1">data / heap / stack</text><text x="865" y="425" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5D6A73" text-anchor="middle" letter-spacing="0" opacity="1">stack grows down from 0x0000_2000</text><text x="1410" y="378" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7C5CE6" text-anchor="middle" letter-spacing="0" opacity="1">RESULT</text><text x="1410" y="403" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7C5CE6" text-anchor="middle" letter-spacing="0" opacity="1">BLOCK</text><text x="1410" y="437" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#5D6A73" text-anchor="middle" letter-spacing="0" opacity="1">0x0000_1FE0–1FFF</text><rect x="360" y="500" width="1120" height="46" rx="14" fill="#0B1620" stroke="none" stroke-width="1" opacity="1"/><text x="920" y="530" font-family="DejaVu Sans Mono,monospace" font-size="17" font-weight="500" fill="#E7F0F3" text-anchor="middle" letter-spacing="0" opacity="1">magic  |  cycles  |  retired instructions  |  checksum  |  extra0  |  extra1  |  extra2  |  done</text></svg>